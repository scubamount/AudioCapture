[package]
name = "audio-capture"
version = "2.1.0"
edition = "2024"
default-run = "audio-capture"
publish = false
description = "Windows process and microphone audio recorder"

[dependencies]
opus = "0.4"
ogg = "0.9"
libflac-sys = { version = "0.3.4", default-features = false, features = ["build-flac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false }
wasapi = "0.27"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Threading", "Win32_Security"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[profile.release]
strip = "symbols"
opt-level = "s"
lto = "fat"
codegen-units = 1
