name: Windows Rust build

on:
  push:
    branches:
      - master
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable-x86_64-pc-windows-msvc
      - name: Check package version and tag
        id: version
        run: |
          $metadata = cargo metadata --locked --offline --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'audio-capture').version
          if (!$version) { throw 'Cargo did not return the audio-capture package version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Expected the tag v$version for this Cargo package."
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check benchmark data and charts
        working-directory: .
        run: python -B docs/benchmarks/generate.py --check
      - name: Test package assembly
        run: python -B -m unittest discover -s tools -p test_package.py
      - name: Prepare Windows Media Foundation for MP3 tests
        shell: powershell
        run: |
          if (!(Get-WindowsFeature -Name Server-Media-Foundation).Installed) {
            $result = Install-WindowsFeature -Name Server-Media-Foundation
            if (!$result.Success) { throw 'Could not install Windows Media Foundation.' }
          }
      - name: Prepare FFmpeg for codec and chunk tests
        run: |
          $name = 'ffmpeg-9.1-essentials_build'
          $archive = Join-Path $env:RUNNER_TEMP "$name.7z"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/9.1/$name.7z" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '835b9a733445ba7a56a37a26cf7bde84e2f3ce7da2a8ec984276bb2abb1b922c') {
            throw 'FFmpeg download checksum mismatch.'
          }
          7z x $archive "-o$env:RUNNER_TEMP" -bso0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Join-Path $env:RUNNER_TEMP "$name/bin"
          & "$bin/ffprobe.exe" -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $encoders = & "$bin/ffmpeg.exe" -hide_banner -encoders
          if ($LASTEXITCODE -ne 0 -or !($encoders -match '\blibopus\b')) { throw 'FFmpeg must include libopus.' }
          $bin >> $env:GITHUB_PATH
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run Windows tests
        run: cargo test --locked --offline --release
      - name: Build the portable ZIP
        run: python -B tools/package.py --output "$env:RUNNER_TEMP/dist/AudioCapture-Rust-Windows-x64.zip"
      - name: Verify the packaged worker and write its ZIP checksum
        run: |
          $zip = Get-Item "$env:RUNNER_TEMP/dist/AudioCapture-Rust-Windows-x64.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP 'Audio Capture smoke'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpacked
          $worker = Join-Path $unpacked 'transcribe.exe'
          $version = & $worker --version
          if ($LASTEXITCODE -ne 0 -or "$version" -cne "transcribe $env:PACKAGE_VERSION") { throw "Unexpected version: $version" }
          $help = & $worker --help
          if ($LASTEXITCODE -ne 0 -or !($help -match 'Usage: transcribe')) { throw 'Missing worker help.' }
          python -B tools/check_release.py "$worker"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($zip.DirectoryName)/SHA256SUMS.txt", "$digest  $($zip.Name)`n")
      - name: Upload the verified ZIP and checksum
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AudioCapture-Rust-Windows-x64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.windows.outputs.commit }}
          sparse-checkout: docs/releases
          persist-credentials: false
      - name: Download the artifact from the Windows job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Verify and publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_COMMIT: ${{ needs.windows.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          zip=AudioCapture-Rust-Windows-x64.zip
          sha256sum "$zip" | cmp - SHA256SUMS.txt
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$GITHUB_REF_NAME" --jq .sha)
          [[ "$remote_commit" == "$TESTED_COMMIT" ]] || { echo 'The tag no longer points to the tested commit.' >&2; exit 1; }
          notes="../docs/releases/$GITHUB_REF_NAME.md"
          args=(--generate-notes)
          if [[ -f "$notes" ]]; then args=(--notes-file "$notes"); fi
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$zip" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Audio Capture $GITHUB_REF_NAME" "${args[@]}"
